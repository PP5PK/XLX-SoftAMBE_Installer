###############################################################################
#  ambed software transcoder (SoftAMBE) - audio settings
#
#  Every audio setting of the transcoder lives in this file.
#  After changing a value, apply it with:
#
#      sudo systemctl restart ambed xlxd
#
#  Then check the values in use with:
#
#      journalctl -u ambed -b | grep SoftAMBE
#
#  Rules:
#   - one KEY=value per line, whole numbers only, no spaces around "="
#   - comments only on their own line: text after a value breaks it
#   - change in small steps (2-3) and test on air between changes
#   - a value out of range is clamped; an invalid one falls back to the
#     default (shown in brackets) and is reported in the log
#   - delete or comment out a line to go back to its default
#
#  Paths:
#   D-Star  -> DMR/YSF : what DMR and C4FM (YSF) radios hear from D-Star
#   DMR/YSF -> D-Star  : what D-Star radios hear from DMR and C4FM (YSF)
###############################################################################


# --- General ------------------------------------------------------------------

# PAIRS = simultaneous transcoded streams, each one D-Star -> DMR/YSF plus
# one DMR/YSF -> D-Star at the same time (1 to 16, 0 = transcoder off)
AMBED_SOFT_PAIRS=__PAIRS__


# --- D-Star -> DMR/YSF ----------------------------------------------------------

# GAIN = value > louder, value < quieter (dB, -24 to 24) [-20]
#        negative values: -18 is louder than -20
AMBED_SOFT_GAIN_DSTAR_TO_DMR=-20

# EQ = value > more treble, value < more bass (dB, 0 to 12, 0 = off) [0]
AMBED_SOFT_EQ_DSTAR_TO_DMR=0

# GATE = value > less noise in pauses, value < keeps quieter words
#        (dBFS, -90 to -1, 0 = off; -40 cuts more than -50) [0]
AMBED_SOFT_GATE_DSTAR_TO_DMR=0


# --- DMR/YSF -> D-Star ----------------------------------------------------------

# GAIN = value > louder, value < quieter (dB, -24 to 24) [17]
AMBED_SOFT_GAIN_DMR_TO_DSTAR=17

# EQ = value > more treble, value < more bass (dB, 0 to 12, 0 = off) [0]
AMBED_SOFT_EQ_DMR_TO_DSTAR=0

# GATE = value > less noise in pauses, value < keeps quieter words
#        (dBFS, -90 to -1, 0 = off; -40 cuts more than -50) [-45]
AMBED_SOFT_GATE_DMR_TO_DSTAR=-45


# --- Equalizer shape (both paths, only where EQ is not 0) --------------------

# LOWCUT = value > less bass / boom, value < more bass
#          (Hz, 0 to 600, 0 = no low cut) [250]
AMBED_SOFT_EQ_LOWCUT_HZ=250

# PEAK = centre of the EQ boost: value > brighter / sharper,
#        value < fuller / warmer (Hz, 500 to 3500) [1800]
AMBED_SOFT_EQ_PEAK_HZ=1800


# --- Noise gate shape (both paths, only where GATE is not 0) -----------------

# RATIO = value > stronger cut below the threshold, value < softer
#         (dB of cut per dB under GATE, 1 to 10) [2]
AMBED_SOFT_GATE_RATIO=2

# MAX = value > quieter pauses, value < more natural background
#       (largest cut in dB, 0 to 40) [20]
AMBED_SOFT_GATE_MAX_DB=20

# HOLD = value > keeps word endings longer, value < closes sooner
#        (ms the gate stays open after speech, 0 to 1000) [100]
AMBED_SOFT_GATE_HOLD_MS=100

# RELEASE = value > smoother fade into silence, value < faster
#           (ms to close fully, 20 to 2000) [270]
AMBED_SOFT_GATE_RELEASE_MS=270


# --- Vocoder ----------------------------------------------------------------

# IDLE_RESET = silence after which the vocoders start fresh, so a new
#              transmission does not inherit the previous speaker
#              (ms, 100 to 5000) [500]
AMBED_SOFT_IDLE_RESET_MS=500
